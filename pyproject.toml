[project]
name = "clearslate"
version = "0.1.0"
description = "Agentic screenplay pre-clearance research reports"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
    "google-cloud-aiplatform[agent_engines,adk]>=1.101.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pdfplumber>=0.11",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27", "ruff>=0.6", "fpdf2>=2.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["clearslate"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-m 'not live'"
markers = ["live: calls real GCP APIs; run explicitly with: uv run pytest -m live -o addopts=''"]

[tool.ruff]
line-length = 100
target-version = "py312"
