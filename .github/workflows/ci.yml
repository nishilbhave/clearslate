name: ci
on:
  push: {branches: [main]}
  pull_request:
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: {python-version: "3.12"}
      - run: uv sync --locked
      - run: uv run ruff check clearslate tests scripts
      - run: uv run pytest
